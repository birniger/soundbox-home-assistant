rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: exempt
    comment: |
      Nothing is polled. Soundbox answers an action or an Assist sentence and
      is otherwise silent.
  brands: done
  common-modules:
    status: exempt
    comment: |
      There is no coordinator and there are no entities, so there is no shared
      base class for one to live in. The account lookup that the actions and
      Assist both need is a single helper in __init__.
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: todo
  docs-conditions:
    status: exempt
    comment: No conditions are provided.
  docs-high-level-description: todo
  docs-installation-instructions: todo
  docs-removal-instructions: todo
  docs-triggers:
    status: exempt
    comment: No triggers are provided.
  entity-event-setup:
    status: exempt
    comment: |
      No entities. Soundbox plays through media players it does not own, and
      offers its library as a media source rather than shadowing the speaker
      that is actually making the sound.
  entity-unique-id:
    status: exempt
    comment: No entities.
  has-entity-name:
    status: exempt
    comment: No entities.
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done
